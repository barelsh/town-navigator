<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Town Navigator</title>
</head>
<body>
  <div id="status">Loading town…</div>

  <div id="hud">
    <b>Town Navigator</b><br />
    W / ↑ accelerate · S / ↓ brake/reverse<br />
    A D / ← → steer · C switch camera<br />
    Click a building for details<br />
    Speed: <span id="speed">0</span> km/h
  </div>

  <div id="street" dir="rtl" hidden></div>

  <div id="compass">
    <svg viewBox="-50 -50 100 100" aria-hidden="true">
      <g id="compass-dial">
        <circle r="47" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="2" />
        <g transform="translate(0 -34)"><text class="north">N</text></g>
        <g transform="translate(34 0)"><text>E</text></g>
        <g transform="translate(0 34)"><text>S</text></g>
        <g transform="translate(-34 0)"><text>W</text></g>
      </g>
      <polygon points="0,-22 7,10 0,5 -7,10" fill="#ffd166" />
    </svg>
    <span id="compass-reading">0° N</span>
  </div>

  <div id="building-tooltip" role="dialog" aria-label="Building details" hidden>
    <div class="tip-head">
      <span class="tip-icon" id="tip-icon"></span>
      <div class="tip-title" id="tip-title" dir="auto"></div>
      <button id="tip-close" type="button" aria-label="Close">×</button>
    </div>
    <div class="tip-sub"><span class="swatch" id="tip-swatch"></span><span id="tip-group"></span><span id="tip-id"></span></div>
    <dl class="tip-facts" id="tip-facts"></dl>
    <dl class="tip-tags" id="tip-tags"></dl>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
