    // ---------- Town layout ----------
    // GeoJSON [x east, y north] maps to world (x, 0, -y).
    const [minX, minY, maxX, maxY] = TOWN.bbox;

    const roads = TOWN.features.filter(f => f.properties.highway && f.geometry.type === 'LineString');

    // Types not listed here (e.g. proposed roads) are not drawn.
    const ROAD_STYLES = {
      motorway:       { width: 12,  color: ASPHALT,    layer: 7, line: true },
      trunk:          { width: 11,  color: ASPHALT,    layer: 7, line: true },
      primary:        { width: 10,  color: ASPHALT,    layer: 7, line: true },
      secondary:      { width: 9,   color: ASPHALT,    layer: 6, line: true },
      tertiary:       { width: 8,   color: ASPHALT,    layer: 6, line: true },
      trunk_link:     { width: 5.5, color: ASPHALT,    layer: 5 },
      primary_link:   { width: 5.5, color: ASPHALT,    layer: 5 },
      secondary_link: { width: 5.5, color: ASPHALT,    layer: 5 },
      tertiary_link:  { width: 5.5, color: ASPHALT,    layer: 5 },
      residential:    { width: 6.5, color: ASPHALT,    layer: 4, line: true },
      unclassified:   { width: 6,   color: ASPHALT,    layer: 4, line: true },
      road:           { width: 6,   color: ASPHALT,    layer: 4, line: true },
      living_street:  { width: 5,   color: ASPHALT,    layer: 4 },
      service:        { width: 4,   color: ASPHALT,    layer: 3 },
      track:          { width: 3,   color: DIRT,       layer: 2 },
      cycleway:       { width: 2.5, color: CYCLE_LANE, layer: 1 },
      pedestrian:     { width: 4,   color: FOOTPATH,   layer: 0 },
      footway:        { width: 2,   color: FOOTPATH,   layer: 0 },
      steps:          { width: 2,   color: FOOTPATH,   layer: 0 },
      path:           { width: 1.5, color: FOOTPATH,   layer: 0 },
    };

    const SURFACE_COLORS = {
      asphalt: ASPHALT, concrete: CONCRETE, paving_stones: PAVERS, sett: PAVERS, ground: DIRT, unpaved: DIRT,
    };

    function roadStyle({ highway, lanes, surface }) {
      const style = ROAD_STYLES[highway];
      if (!style) return null;
      const laneCount = parseInt(lanes, 10);
      return {
        ...style,
        width: laneCount > 0 ? laneCount * LANE_WIDTH : style.width,
        color: SURFACE_COLORS[surface] ?? style.color,
        line: Boolean(style.line) && laneCount !== 1,
      };
    }

    const DASH_LENGTH = 2.2;
    const DASH_SPACING = 5;
    const JOINT_SEGMENTS = 12;
    const CAR_RADIUS = 1.1;
    const GROUND_MARGIN = 600;

    // Grass
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(maxX - minX + GROUND_MARGIN, maxY - minY + GROUND_MARGIN),
      new THREE.MeshLambertMaterial({ color: 0x6fae4f })
    );
    ground.rotation.x = -Math.PI / 2;

    ground.receiveShadow = true;

    // Roads: all triangles lie flat and are merged into one mesh per layer and color.
    function addQuad(out, ax, az, bx, bz, halfWidth) {
      const length = Math.hypot(bx - ax, bz - az);
      const sx = (bz - az) / length * halfWidth;
      const sz = -(bx - ax) / length * halfWidth;
      out.push(
        ax + sx, 0, az + sz, ax - sx, 0, az - sz, bx - sx, 0, bz - sz,
        ax + sx, 0, az + sz, bx - sx, 0, bz - sz, bx + sx, 0, bz + sz
      );
    }

    function addDisc(out, x, z, radius) {
      const point = i => {
        const angle = (i / JOINT_SEGMENTS) * Math.PI * 2;
        return [x + Math.cos(angle) * radius, 0, z + Math.sin(angle) * radius];
      };
      for (let i = 0; i < JOINT_SEGMENTS; i++) out.push(x, 0, z, ...point(i + 1), ...point(i));
    }

    function addDashes(out, ax, az, bx, bz, length, travelled) {
      const ux = (bx - ax) / length, uz = (bz - az) / length;
      const end = travelled + length;
      for (let dash = Math.floor(travelled / DASH_SPACING) * DASH_SPACING; dash < end; dash += DASH_SPACING) {
        const from = Math.max(dash, travelled) - travelled;

      if (!surfaceBuckets.has(key)) surfaceBuckets.set(key, { layer, color, positions: [] });

    }

    for (const road of roads) {
      const style = roadStyle(road.properties);
      if (!style) continue;

      const points = road.geometry.coordinates.map(([x, y]) => [x, -y]);
      const positions = surfacePositions(style);
      const middle = (points.length - 1) >> 1;

    // Deterministic random so the town looks the same on every reload

    const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

    }

    function touchesRing(x, z, ring) {
      return ring.some(([ax, az], i) => {
        const [bx, bz] = ring[(i + 1) % ring.length];
        return distanceToSegment(x, z, ax, az, bx, bz) < CAR_RADIUS;
      });
    }

    function hitsBuilding(x, z) {
      return obstacles.some(b =>
        x > b.minX - CAR_RADIUS && x < b.maxX + CAR_RADIUS &&
        z > b.minZ - CAR_RADIUS && z < b.maxZ + CAR_RADIUS &&
        (pointInRing(x, z, b.ring) || touchesRing(x, z, b.ring)));
    }

    const outsideTown = (x, z) => x < minX || x > maxX || z < -maxY || z > -minY;

    // ---------- Car ----------
    // Sedan dimensions, in meters
    const CAR_LENGTH = 4.5, CAR_WIDTH = 1.8, CAR_HEIGHT = 1.45, WHEEL_RADIUS = 0.33;
    const car = new THREE.Group();
    const carBody = new THREE.Mesh(new THREE.BoxGeometry(CAR_WIDTH, 0.65, CAR_LENGTH), new THREE.MeshLambertMaterial({ color: 0xd62828 }));
    carBody.position.y = 0.575;
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.55, CAR_HEIGHT - 0.9, 2.3), new THREE.MeshLambertMaterial({ color: 0xf1faee }));
    cabin.position.set(0, (CAR_HEIGHT + 0.9) / 2, -0.3);
    car.add(carBody, cabin);
    const wheelGeo = new THREE.CylinderGeometry(WHEEL_RADIUS, WHEEL_RADIUS, 0.22, 14);
    wheelGeo.rotateZ(Math.PI / 2);
    const wheelMat = new THREE.MeshLambertMaterial({ color: 0x1b1b1b });
    const wheels = [];
    for (const [x, z] of [[-0.79, 1.45], [0.79, 1.45], [-0.79, -1.45], [0.79, -1.45]]) {
      const w = new THREE.Mesh(wheelGeo, wheelMat);
      w.position.set(x, WHEEL_RADIUS, z);
      car.add(w);
      wheels.push(w);
    }
    // Headlights
    for (const x of [-0.6, 0.6]) {
      const hl = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.2, 0.05), new THREE.MeshBasicMaterial({ color: 0xfff3b0 }));
      hl.position.set(x, 0.7, CAR_LENGTH / 2);
      car.add(hl);
    }
    car.traverse(o => { if (o.isMesh) o.castShadow = true; });
    car.position.set(start.x, 0, start.z);
    car.rotation.y = start.heading;
    scene.add(car);

    // ---------- Controls & physics ----------
    const keys = {};
    addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'KeyC') camMode = (camMode + 1) % 2;
    });
    addEventListener('keyup', e => (keys[e.code] = false));

    let speed = 0, heading = start.heading, camMode = 0;
    const MAX = 22, ACCEL = 14, BRAKE = 24, FRICTION = 6;
    const forward = new THREE.Vector3();

    function update(dt) {
      const up = keys.KeyW || keys.ArrowUp, down = keys.KeyS || keys.ArrowDown;
      const left = keys.KeyA || keys.ArrowLeft, right = keys.KeyD || keys.ArrowRight;

      if (up) speed += ACCEL * dt;
      else if (down) speed -= (speed > 0 ? BRAKE : ACCEL * 0.6) * dt;
      else speed -= Math.sign(speed) * Math.min(Math.abs(speed), FRICTION * dt);
      speed = THREE.MathUtils.clamp(speed, -MAX * 0.4, MAX);

      const steer = (left ? 1 : 0) - (right ? 1 : 0);
      heading += steer * dt * 2.2 * THREE.MathUtils.clamp(speed / 8, -1, 1);

      forward.set(Math.sin(heading), 0, Math.cos(heading));
      const prev = car.position.clone();
      car.position.addScaledVector(forward, speed * dt);
      car.rotation.y = heading;

      // Collide with buildings and the town edge
      if (hitsBuilding(car.position.x, car.position.z) || outsideTown(car.position.x, car.position.z)) {
        car.position.copy(prev);
        speed *= -0.3;
      }

      // Keep the shadow area around the car
      sun.target.position.copy(car.position);
      sun.position.copy(car.position).add(SUN_OFFSET);

      for (const w of wheels) w.rotation.x += speed * dt / WHEEL_RADIUS;
      document.getElementById('speed').textContent = Math.round(Math.abs(speed) * 3.6);
    }

    // ---------- Camera follow ----------
    const camTarget = new THREE.Vector3();
    function updateCamera(dt) {
      const offset = camMode === 0
        ? new THREE.Vector3(-Math.sin(heading) * 10, 5, -Math.cos(heading) * 10) // chase
        : new THREE.Vector3(0, tallestBuilding + 30, 0);                        // top-down
      // Top-down, screen up follows the car, so the map turns around it.
      const up = camMode === 0
        ? new THREE.Vector3(0, 1, 0)
        : new THREE.Vector3(Math.sin(heading), 0, Math.cos(heading));
      camera.position.lerp(car.position.clone().add(offset), 1 - Math.exp(-dt * 5));
      camera.up.lerp(up, 1 - Math.exp(-dt * 5)).normalize();
      camTarget.lerp(car.position.clone().setY(1), 1 - Math.exp(-dt * 8));
      camera.lookAt(camTarget);
    }
    camera.position.set(car.position.x - 10, 6, car.position.z - 10);
    camTarget.copy(car.position);

    // ---------- Compass ----------
    const compassDial = document.getElementById('compass-dial');
    const compassLetters = compassDial.querySelectorAll('text');
    const compassReading = document.getElementById('compass-reading');
    const COMPASS_POINTS = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];

    function updateCompass() {
      // Car forward is (sin, cos) in (x, z) and north is -z, so bearing = 180° - heading.
      const bearing = THREE.MathUtils.euclideanModulo(180 - THREE.MathUtils.radToDeg(heading), 360);

      // The needle stays pointing up; the dial turns under it, with upright letters.
      compassDial.setAttribute('transform', `rotate(${-bearing})`);
      compassLetters.forEach(letter => letter.setAttribute('transform', `rotate(${bearing})`));

      const degrees = Math.round(bearing) % 360;
      compassReading.textContent = `${degrees}° ${COMPASS_POINTS[Math.round(bearing / 45) % 8]}`;
    }

    // ---------- Loop ----------
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 0.05);
      update(dt);
      updateCamera(dt);
      updateCompass();
      renderer.render(scene, camera);
    });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
