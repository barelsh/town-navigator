<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Town Navigator</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd3ff; font-family: system-ui, sans-serif; }
    #hud {
      position: fixed; top: 12px; left: 12px; padding: 10px 14px;
      background: rgba(20, 24, 32, 0.72); color: #fff; border-radius: 10px;
      font-size: 13px; line-height: 1.5; pointer-events: none;
    }
    #hud b { color: #ffd166; }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="hud">
    <b>Town Navigator</b><br />
    W / ↑ accelerate · S / ↓ brake/reverse<br />
    A D / ← → steer · C switch camera<br />
    Speed: <span id="speed">0</span> km/h
  </div>

  <script type="module">
    import * as THREE from 'three';

    // ---------- Renderer, scene, camera ----------
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9fd3ff);
    scene.fog = new THREE.Fog(0x9fd3ff, 60, 180);

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 500);

    // ---------- Lights ----------
    scene.add(new THREE.HemisphereLight(0xdff1ff, 0x5a7a3a, 0.9));
    const sun = new THREE.DirectionalLight(0xffffff, 1.6);
    sun.position.set(40, 60, 25);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -80, right: 80, top: 80, bottom: -80, near: 1, far: 200 });
    scene.add(sun);

    // ---------- Town layout ----------
    const BLOCK = 20;        // block size
    const ROAD = 8;          // road width
    const GRID = 5;          // blocks per side
    const CELL = BLOCK + ROAD;
    const HALF = (GRID * CELL) / 2;

    // Grass
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(400, 400),
      new THREE.MeshLambertMaterial({ color: 0x6fae4f })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Roads (a grid of asphalt strips) + dashed centre lines
    const asphalt = new THREE.MeshLambertMaterial({ color: 0x3b3f46 });
    const lineMat = new THREE.MeshBasicMaterial({ color: 0xf5f1d0 });
    const roadLen = GRID * CELL + ROAD;
    for (let i = 0; i <= GRID; i++) {
      const p = -HALF + i * CELL;
      for (const horiz of [true, false]) {
        const road = new THREE.Mesh(new THREE.PlaneGeometry(horiz ? roadLen : ROAD, horiz ? ROAD : roadLen), asphalt);
        road.rotation.x = -Math.PI / 2;
        road.position.set(horiz ? 0 : p, 0.02, horiz ? p : 0);
        road.receiveShadow = true;
        scene.add(road);

        for (let d = -roadLen / 2 + 2; d < roadLen / 2; d += 5) {
          const dash = new THREE.Mesh(new THREE.PlaneGeometry(horiz ? 2.2 : 0.25, horiz ? 0.25 : 2.2), lineMat);
          dash.rotation.x = -Math.PI / 2;
          dash.position.set(horiz ? d : p, 0.03, horiz ? p : d);
          scene.add(dash);
        }
      }
    }

    // Deterministic random so the town looks the same on every reload
    let seed = 7;
    const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

    const palette = [0xe76f51, 0xf4a261, 0xe9c46a, 0x2a9d8f, 0x8ecae6, 0xcdb4db, 0xf1faee, 0xb5838d];
    const roofMat = new THREE.MeshLambertMaterial({ color: 0x5b4636 });
    const windowMat = new THREE.MeshLambertMaterial({ color: 0x2b3a55, emissive: 0x1a2236 });
    const trunkMat = new THREE.MeshLambertMaterial({ color: 0x7a5230 });
    const leafMat = new THREE.MeshLambertMaterial({ color: 0x3f8f3a });
    const sidewalkMat = new THREE.MeshLambertMaterial({ color: 0xc9c4b8 });

    const obstacles = []; // axis-aligned boxes the car collides with

    function addBuilding(x, z, w, d) {
      const h = 4 + rand() * 18;
      const g = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshLambertMaterial({ color: palette[Math.floor(rand() * palette.length)] })
      );
      body.position.y = h / 2;
      body.castShadow = body.receiveShadow = true;
      g.add(body);

      // Flat roof cap
      const roof = new THREE.Mesh(new THREE.BoxGeometry(w + 0.4, 0.5, d + 0.4), roofMat);
      roof.position.y = h + 0.25;
      roof.castShadow = true;
      g.add(roof);

      // Window rows on front and back
      for (let y = 2; y < h - 1; y += 3) {
        for (let wx = -w / 2 + 1.5; wx <= w / 2 - 1.5; wx += 2.5) {
          for (const side of [1, -1]) {
            const win = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 1.4), windowMat);
            win.position.set(wx, y, side * (d / 2 + 0.01));
            if (side < 0) win.rotation.y = Math.PI;
            g.add(win);
          }
        }
      }
      g.position.set(x, 0, z);
      scene.add(g);
      obstacles.push(new THREE.Box3().setFromObject(body));
    }

    function addTree(x, z) {
      const g = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.3, 1.6), trunkMat);
      trunk.position.y = 0.8;
      const crown = new THREE.Mesh(new THREE.ConeGeometry(1.4, 3.2, 7), leafMat);
      crown.position.y = 3;
      trunk.castShadow = crown.castShadow = true;
      g.add(trunk, crown);
      g.position.set(x, 0, z);
      g.scale.setScalar(0.8 + rand() * 0.5);
      scene.add(g);
      obstacles.push(new THREE.Box3().setFromCenterAndSize(new THREE.Vector3(x, 1, z), new THREE.Vector3(0.8, 2, 0.8)));
    }

    // Fill each block: sidewalk slab + either a park or 2–4 buildings
    for (let i = 0; i < GRID; i++) {
      for (let j = 0; j < GRID; j++) {
        const cx = -HALF + ROAD / 2 + i * CELL + BLOCK / 2;
        const cz = -HALF + ROAD / 2 + j * CELL + BLOCK / 2;

        const slab = new THREE.Mesh(new THREE.BoxGeometry(BLOCK, 0.2, BLOCK), sidewalkMat);
        slab.position.set(cx, 0.1, cz);
        slab.receiveShadow = true;
        scene.add(slab);

        if (rand() < 0.2) {
          // Park
          const lawn = new THREE.Mesh(new THREE.BoxGeometry(BLOCK - 2, 0.25, BLOCK - 2),
            new THREE.MeshLambertMaterial({ color: 0x7fc15a }));
          lawn.position.set(cx, 0.12, cz);
          lawn.receiveShadow = true;
          scene.add(lawn);
          for (let t = 0; t < 6; t++) addTree(cx + (rand() - 0.5) * 14, cz + (rand() - 0.5) * 14);
        } else {
          // 2x2 lots, some left empty
          for (const ox of [-4.5, 4.5]) for (const oz of [-4.5, 4.5]) {
            if (rand() < 0.15) continue;
            addBuilding(cx + ox, cz + oz, 6 + rand() * 2, 6 + rand() * 2);
          }
        }
      }
    }

    // ---------- Car ----------
    const car = new THREE.Group();
    const carBody = new THREE.Mesh(new THREE.BoxGeometry(2, 0.8, 4), new THREE.MeshLambertMaterial({ color: 0xd62828 }));
    carBody.position.y = 0.7;
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.7, 2), new THREE.MeshLambertMaterial({ color: 0xf1faee }));
    cabin.position.set(0, 1.45, -0.3);
    car.add(carBody, cabin);
    const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 14);
    wheelGeo.rotateZ(Math.PI / 2);
    const wheelMat = new THREE.MeshLambertMaterial({ color: 0x1b1b1b });
    const wheels = [];
    for (const [x, z] of [[-1, 1.3], [1, 1.3], [-1, -1.3], [1, -1.3]]) {
      const w = new THREE.Mesh(wheelGeo, wheelMat);
      w.position.set(x, 0.4, z);
      car.add(w);
      wheels.push(w);
    }
    // Headlights
    for (const x of [-0.6, 0.6]) {
      const hl = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.2, 0.05), new THREE.MeshBasicMaterial({ color: 0xfff3b0 }));
      hl.position.set(x, 0.8, 2.01);
      car.add(hl);
    }
    car.traverse(o => { if (o.isMesh) o.castShadow = true; });
    car.position.set(-HALF, 0, 0); // start on a road
    scene.add(car);

    // ---------- Controls & physics ----------
    const keys = {};
    addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'KeyC') camMode = (camMode + 1) % 2;
    });
    addEventListener('keyup', e => (keys[e.code] = false));

    let speed = 0, heading = 0, camMode = 0;
    const MAX = 22, ACCEL = 14, BRAKE = 24, FRICTION = 6;
    const carBox = new THREE.Box3();
    const forward = new THREE.Vector3();

    function update(dt) {
      const up = keys.KeyW || keys.ArrowUp, down = keys.KeyS || keys.ArrowDown;
      const left = keys.KeyA || keys.ArrowLeft, right = keys.KeyD || keys.ArrowRight;

      if (up) speed += ACCEL * dt;
      else if (down) speed -= (speed > 0 ? BRAKE : ACCEL * 0.6) * dt;
      else speed -= Math.sign(speed) * Math.min(Math.abs(speed), FRICTION * dt);
      speed = THREE.MathUtils.clamp(speed, -MAX * 0.4, MAX);

      const steer = (left ? 1 : 0) - (right ? 1 : 0);
      heading += steer * dt * 2.2 * THREE.MathUtils.clamp(speed / 8, -1, 1);

      forward.set(Math.sin(heading), 0, Math.cos(heading));
      const prev = car.position.clone();
      car.position.addScaledVector(forward, speed * dt);
      car.rotation.y = heading;

      // Collide with buildings/trees and the town edge
      carBox.setFromCenterAndSize(car.position.clone().setY(1), new THREE.Vector3(2.2, 2, 2.2));
      const limit = HALF + ROAD / 2 - 1.2;
      if (obstacles.some(b => b.intersectsBox(carBox)) ||
          Math.abs(car.position.x) > limit || Math.abs(car.position.z) > limit) {
        car.position.copy(prev);
        speed *= -0.3;
      }

      for (const w of wheels) w.rotation.x += speed * dt / 0.4;
      document.getElementById('speed').textContent = Math.round(Math.abs(speed) * 3.6);
    }

    // ---------- Camera follow ----------
    const camTarget = new THREE.Vector3();
    function updateCamera(dt) {
      const offset = camMode === 0
        ? new THREE.Vector3(-Math.sin(heading) * 10, 5, -Math.cos(heading) * 10) // chase
        : new THREE.Vector3(0, 55, 0.01);                                       // top-down
      camera.position.lerp(car.position.clone().add(offset), 1 - Math.exp(-dt * 5));
      camTarget.lerp(car.position.clone().setY(1), 1 - Math.exp(-dt * 8));
      camera.lookAt(camTarget);
    }
    camera.position.set(car.position.x - 10, 6, car.position.z - 10);
    camTarget.copy(car.position);

    // ---------- Loop ----------
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 0.05);
      update(dt);
      updateCamera(dt);
      renderer.render(scene, camera);
    });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
